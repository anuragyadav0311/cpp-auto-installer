name: Cross-Platform Installer Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run Windows Installer
        shell: powershell
        run: .\windows\install_cpp.ps1

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run Linux Installer
        run: |
          chmod +x ./linux/install_cpp.sh
          sudo ./linux/install_cpp.sh

  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Run macOS Installer
        run: |
          chmod +x ./macos/install_cpp.sh
          ./macos/install_cpp.sh